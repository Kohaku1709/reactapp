services:
  # 1. CONTAINER CO SO DU LIEU: PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: stayhtm_db_container
    restart: always
    environment:
      POSTGRES_DB: stayhtm_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1709
    ports:
      - "5432:5432"
    volumes:
      # Luu tru du lieu ben vung, khong bi mat khi xoa container
      - pgdata:/var/lib/postgresql/data

  # 2. CONTAINER MAY CHU BACKEND: Node.js Express API
  backend:
    build:
      context: ./backend-simplified
      dockerfile: Dockerfile
    container_name: stayhtm_backend_container
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=stayhtm_db
      - DB_USER=postgres
      - DB_PASSWORD=1709
      - JWT_SECRET=your_super_secret_key_change_this_in_production
      - JWT_EXPIRES_IN=7d
      # Cho phep Frontend thuc hien cac CORS request tu cong 80
      - CLIENT_URL=http://localhost
    depends_on:
      - db

  # 3. CONTAINER GIAO DIEN FRONTEND: Web Server Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stayhtm_frontend_container
    restart: always
    ports:
      # Expose cong 80 de co the truy cap truc tiep tu trinh duyet o dia chi: http://localhost
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
